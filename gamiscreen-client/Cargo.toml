[package]
name = "gamiscreen-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
keyring-core = "1.0.1"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "signal",
] }
# reqwest = { version = "0.12", default-features = false, features = [
#     "json",
#     "rustls-tls",
# ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
thiserror = "2.0.21"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
url = "2.5.8"
rpassword = "7.5.4"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
async-trait = "0.1.92"
tinytemplate = "1.2.1"
semver = "1.0.28"
sha2 = "0.11.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
eventsource-stream = "0.2.3"
gamiscreen-shared = { path = "../gamiscreen-shared", features = [
    "rest-client",
] }
tokio-util = { version = "0.7.20" }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Shutdown",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    # SHELLEXECUTEINFOW contains an HKEY field gated behind this feature
    "Win32_System_Registry",
] }
tauri-winrt-notification = "0.8.1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
zbus = { version = "6.2.0", default-features = false, features = ["tokio", "proxy"] }
nix = { version = "0.31.3", features = ["user"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["d"] }

[[bin]]
name = "gamiscreen-client"
path = "src/main.rs"
