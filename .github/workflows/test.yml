---
name: Tests

"on":
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libsqlite3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gamiscreen-web/package-lock.json
      # This includes building the gamiscreen-web, so we don't need separate steps for that.
      - name: Run tests
        run: cargo test --workspace

  windows-client-tests:
    name: Windows Client Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build client
        run: cargo build -p gamiscreen-client

      - name: Run client tests
        run: cargo test -p gamiscreen-client
