[package]
name = "gamiscreen-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []


[dependencies]
axum = { version = "0.8.9", features = ["json"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
time = { version = "0.3.55", features = ["macros", "serde"] }
diesel = { version = "2.3.14", features = ["sqlite", "chrono", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3.2"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
slug = "0.1.6"
bcrypt = "0.19.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
rust-embed = "8.13.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
thiserror = { version = "2.0.21" }
clap = { version = "4.6.7", features = ["derive"] }
tinytemplate = "1.2.1"
tokio-util = { version = "0.7.20" }
semver = "1.0.28"
ece = "2.4.2"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

gamiscreen-shared = { path = "../gamiscreen-shared" }

[build-dependencies]
gamiscreen-shared = { path = "../gamiscreen-shared", features = ["ts"] }
serde_json = "1.0.154"


[dev-dependencies]
gamiscreen-shared = { path = "../gamiscreen-shared", features = ["rest-client"] }
tempfile = "3.27.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
base64 = "0.23.1"
